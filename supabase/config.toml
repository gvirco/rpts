# The Edge gateway's legacy-secret JWT verifier does not support modern
# asymmetric Supabase session tokens. The @supabase/server wrapper in
# execute-trade independently requires and validates an authenticated user JWT.
[functions.execute-trade]
verify_jwt = false

[functions.market-data]
enabled = true
verify_jwt = false
import_map = "./functions/market-data/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/market-data/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/market-data/*.html" ]
